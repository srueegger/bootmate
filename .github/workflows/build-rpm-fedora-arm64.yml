name: Build RPM Fedora 43 ARM64

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-rpm-fedora-arm64:
    name: Build RPM (Fedora 43 ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get version from meson.build
        id: version
        run: |
          VERSION=$(grep "version:" meson.build | head -n1 | sed "s/.*version: '\(.*\)'.*/\1/")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build in ARM64 Fedora container
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            fedora:43 bash -c "
              dnf install -y \
                meson \
                gcc \
                rust \
                cargo \
                pkgconfig \
                gtk4-devel \
                libadwaita-devel \
                glib2-devel \
                gettext \
                desktop-file-utils \
                libappstream-glib \
                rpm-build \
                rpmdevtools && \
              rpmdev-setuptree && \
              mkdir -p /tmp/bootmate-${{ steps.version.outputs.version }} && \
              cp -r * /tmp/bootmate-${{ steps.version.outputs.version }}/ 2>/dev/null || true && \
              cd /tmp && \
              tar czf /root/rpmbuild/SOURCES/bootmate-${{ steps.version.outputs.version }}.tar.gz bootmate-${{ steps.version.outputs.version }} && \
              cd /workspace && \
              cp bootmate.spec /root/rpmbuild/SPECS/ && \
              sed -i \"s/^Version:.*/Version:        ${{ steps.version.outputs.version }}/\" /root/rpmbuild/SPECS/bootmate.spec && \
              cd /root/rpmbuild/SPECS && \
              rpmbuild -ba bootmate.spec && \
              cp /root/rpmbuild/RPMS/aarch64/*.rpm /workspace/ && \
              cp /root/rpmbuild/SRPMS/*.rpm /workspace/
            "

      - name: List built packages
        run: |
          ls -lh *.rpm

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: rpm-fedora-43-arm64
          path: "*.rpm"
