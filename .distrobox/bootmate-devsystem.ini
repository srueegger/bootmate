[bootmate-devsystem]
image=quay.io/fedora/fedora:44
pull=true
init=true
start_now=false
additional_packages="meson gcc rust cargo gtk4-devel libadwaita-devel glib2-devel gettext gettext-devel desktop-file-utils libappstream-glib libappstream-glib-devel flatpak flatpak-builder git which sudo ostree"
init_hooks="sudo dnf -y upgrade --refresh; sudo flatpak --system remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo; sudo install -d -o $(id -u) -g $(id -g) /var/cache/bootmate-flatpak /var/cache/bootmate-flatpak/state /var/cache/bootmate-flatpak/repo /var/cache/bootmate-flatpak/build /var/cache/bootmate-flatpak/flatpak-user"
